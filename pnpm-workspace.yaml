packages:
  - "apps/*"
  - "packages/*"

# Required by pnpm 11 `pnpm deploy` so workspace packages are materialized
# cleanly in Docker images without dangling symlinks; synced after `build`.
injectWorkspacePackages: true
syncInjectedDepsAfterScripts:
  - build

allowBuilds:
  "@clerk/shared": true
  "@nestjs/core": true
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true

# ajv (via @hookform/resolvers and commitlint) still resolves a fast-uri
# with published advisories; force the patched 3.x line.
overrides:
  fast-uri: ^3.1.9
