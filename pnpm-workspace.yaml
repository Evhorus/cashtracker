packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@clerk/shared": true
  "@nestjs/core": true
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true

# ajv (via @hookform/resolvers and commitlint) still resolves a fast-uri
# with published advisories; force the patched 3.x line.
overrides:
  fast-uri: ^3.1.9
